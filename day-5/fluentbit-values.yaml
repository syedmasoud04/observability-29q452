# Containerd/CRI log collection for kind, with no Docker host-path dependency.
kind: DaemonSet
service:
  type: ClusterIP
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 250m, memory: 256Mi}
tolerations:
  - operator: Exists
env:
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password
extraVolumes:
  - name: es-certs
    secret:
      secretName: elasticsearch-master-certs
extraVolumeMounts:
  - name: es-certs
    mountPath: /etc/elasticsearch/certs
    readOnly: true
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
      type: Directory
daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
config:
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
        Read_from_Head On
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log On
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
    [FILTER]
        Name grep
        Match kube.*
        Exclude $kubernetes['namespace_name'] ^logging$
  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ES_PASSWORD}
        tls On
        tls.verify On
        tls.ca_file /etc/elasticsearch/certs/ca.crt
        Logstash_Format On
        Logstash_Prefix kubernetes
        Suppress_Type_Name On
        Generate_ID On
        Retry_Limit False
