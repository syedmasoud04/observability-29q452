mode: deployment
replicaCount: 1
fullnameOverride: otel-collector
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.161.0"
  pullPolicy: IfNotPresent
command:
  name: otelcol-contrib
service:
  type: ClusterIP
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 384
      spike_limit_mib: 64
    batch: {}
  exporters:
    prometheus:
      endpoint: "0.0.0.0:8889"
    otlp/jaeger:
      endpoint: "jaeger-collector.tracing.svc:4317"
      tls:
        insecure: true
    debug:
      verbosity: basic
  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/jaeger]
      # Optional OTLP logs are written to stdout and picked up by Fluent Bit.
      # The Go examples themselves log to stdout, not through the OTLP Logs SDK.
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
ports:
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
