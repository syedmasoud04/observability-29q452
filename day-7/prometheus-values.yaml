server:
  service:
    type: ClusterIP
  retention: 12h
  persistentVolume:
    enabled: true
    storageClass: standard
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: otel-collector
        scrape_interval: 15s
        static_configs:
          - targets: ["otel-collector.olly.svc:8889"]
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
