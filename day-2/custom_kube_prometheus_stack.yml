# Single-node lab sizing; this is not a highly available deployment.
grafana:
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClassName: standard
    size: 1Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    replicas: 1
    retention: 12h
    retentionSize: 4GB
    scrapeInterval: 30s
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 5Gi}

alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    replicas: 1
    alertmanagerConfigSelector:
      matchLabels:
        release: monitoring
    alertmanagerConfigMatcherStrategy:
      type: None
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 1Gi}

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

# kind does not expose these control-plane metrics endpoints by default.
# Keep API server, kubelet/cAdvisor, node exporter and kube-state-metrics.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
