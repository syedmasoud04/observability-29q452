# Compatibility copy: deploy this only as the shared tracing/jaeger release.
# Compatible with jaeger chart 3.4.0; credentials are copied by local/lab.sh.
storage:
  type: elasticsearch
  elasticsearch:
    host: elasticsearch-master.logging.svc
    port: 9200
    scheme: https
    user: elastic
    existingSecret: jaeger-es-credentials
    existingSecretKey: password
    tls:
      enabled: true
      secretName: es-tls-secret
      mountPath: /es-tls/ca-cert.pem
      subPath: ca-cert.pem
      ca: /es-tls/ca-cert.pem
provisionDataStore:
  cassandra: false
  elasticsearch: false
  kafka: false
agent:
  enabled: false
collector:
  replicaCount: 1
  service:
    type: ClusterIP
    otlp:
      grpc: {name: otlp-grpc, port: 4317}
      http: {name: otlp-http, port: 4318}
  cmdlineParams:
    collector.otlp.enabled: "true"
    collector.otlp.grpc.host-port: "0.0.0.0:4317"
    collector.otlp.http.host-port: "0.0.0.0:4318"
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
query:
  replicaCount: 1
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
